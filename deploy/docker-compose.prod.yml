# TubeLead — production stack for a single VPS (Docker + Caddy for automatic HTTPS).
#   cp deploy/.env.prod.example deploy/.env.prod   # fill every value
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# NOTE: authored without a Docker daemon available — these files were NOT built or started in the authoring environment.
# The same wiring (API ↔ web proxy ↔ Stripe webhook path) was verified with the processes started directly.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config"]
    depends_on: [web]
  web:                       # Next.js (landing + app). Proxies /api/* to the API; the browser only ever talks to this origin.
    build:
      context: ../frontend
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on: [api]
  api:                       # FastAPI + background discovery workers + scheduler (ONE replica: workers/scheduler are in-process)
    build: ../backend
    env_file: .env.prod
    environment:
      REDIS_URL: redis://redis:6379/0
      APP_BASE_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      AUTH_MODE: supabase
      AI_ALLOW_PRIVATE_HOSTS: "false"
      ENVIRONMENT: production
      PLAN_OVERRIDE: ""
    restart: unless-stopped
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # rate-limit counters only; nothing here needs persistence
    restart: unless-stopped
volumes: { caddy-data: {}, caddy-config: {} }
