# TubeLead on Render (https://render.com). Create a Blueprint from this repo; Render asks for the secret values below.
# Two services: the API (FastAPI) and the website (Next.js). Keys are entered in the Render dashboard, never committed.
services:
  - type: web
    name: tubelead-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: AI_ALLOW_PRIVATE_HOSTS
        value: "false"
      - key: DATABASE_URL          # Supabase Postgres connection string (postgresql+psycopg://...)
        sync: false
      - key: SUPABASE_URL          # https://lnrxdnkeolksrkghfjno.supabase.co
        sync: false
      - key: SECRET_KEY            # generate: openssl rand -hex 32
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false                # e.g. https://tubelead-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER_MONTHLY   # Stripe Price IDs (price_...) for each plan and billing period
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ELITE_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ELITE_ANNUAL
        sync: false
      - key: OPERATOR_USER_IDS     # your Supabase user ID: full admin access
        sync: false
      - key: OPENAI_API_KEY        # support assistant; without it, answers come from help articles only
        sync: false
      - key: RESEND_API_KEY        # transactional email
        sync: false
      - key: EMAIL_FROM            # e.g. TubeLead <support@yourdomain.com> (domain verified in Resend)
        sync: false
      - key: ADMIN_ALERT_EMAIL     # where new registrations, tickets and failed payments are reported
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY   # lets "Delete account" also remove the sign-in record
        sync: false
      - key: PUBLIC_API_URL        # this API's public URL, for hosted email images, e.g. https://tubelead-api.onrender.com
        sync: false
      - key: SNOV_CLIENT_ID        # TubeLead's own Snov.io account: contact enrichment and verification
        sync: false
      - key: SNOV_CLIENT_SECRET
        sync: false
      - key: SNOV_COST_PER_CREDIT_PENCE   # what one Snov.io credit costs you, for margin reporting
        sync: false
      - key: BRAVE_API_KEY         # Brave Search API: web discovery for the Growth Assistant
        sync: false
      - key: BRAVE_COST_PER_QUERY_PENCE
        sync: false
      # Extra search sources (Search Everywhere, Pro plan). Each is optional; a source without its key says so.
      # Apple Podcasts, Bluesky, Dailymotion, Mastodon and MusicBrainz need no key.
      - key: GOOGLE_PSE_KEY        # Google Programmable Search: API key
        sync: false
      - key: GOOGLE_PSE_CX         # Google Programmable Search: search engine ID
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: VIMEO_ACCESS_TOKEN
        sync: false
      - key: MASTODON_INSTANCE     # optional: Mastodon server to search (default mastodon.social)
        sync: false
  - type: web
    name: tubelead-web
    runtime: docker
    rootDir: frontend
    healthCheckPath: /login
    envVars:
      - key: BACKEND_URL           # the API's public URL, e.g. https://tubelead-api.onrender.com
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
